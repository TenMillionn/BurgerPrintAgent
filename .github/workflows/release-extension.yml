name: Release Chrome Extension

# Trigger when a release tag is pushed (e.g. after merging to main and tagging v1.2.3).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keep the extension's manifest version in sync with the release tag (v1.2.3 -> 1.2.3).
      - name: Sync manifest version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const f='public/manifest.json',m=require('./'+f);m.version='${VERSION}';require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n');console.log('manifest version ->',m.version)"

      - name: Build extension
        # Bake the production backend URL into the extension build so it talks to
        # the real backend (not localhost). Override via the BACKEND_URL repo/org
        # variable if the domain changes — falls back to the default below.
        env:
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL || 'https://burgerprint.vocatee.com/api' }}
        run: npm run build

      # Zip the built unpacked extension (contents of dist/) so it can be loaded directly.
      - name: Zip extension
        run: |
          cd dist
          zip -r "../burgerprints-agent-extension-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub Release and attach zip
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/burgerprints-agent-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
